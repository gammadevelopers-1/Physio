# ===========================================
# PhysioGuidance - Full Stack Local Development
# ===========================================
# Runs everything in Docker: Frontend + Backend + Database
#
# Usage:
#   make dev          - Start all services
#   make dev-logs     - View logs
#   make dev-down     - Stop all services
# ===========================================

version: '3.8'

services:
  # ===========================================
  # Frontend - Next.js
  # ===========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: physio-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    volumes:
      - ./frontend/src:/app/src:delegated
      - ./frontend/public:/app/public:delegated
      - ./frontend/messages:/app/messages:delegated
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - physio-network
    restart: unless-stopped

  # ===========================================
  # Backend - NestJS
  # ===========================================
  backend:
    build:
      context: ./backends
      dockerfile: Dockerfile.dev
    container_name: physio-backend
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - DATABASE_HOST=database
      - DATABASE_PORT=5432
      - DATABASE_NAME=physioguidance
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - CORS_ORIGIN=http://localhost:3000
      - LOG_LEVEL=debug
      - JWT_SECRET=physio-dev-secret-change-in-production-2026
      - JWT_ACCESS_EXPIRATION=15m
      - JWT_REFRESH_EXPIRATION_DAYS=7
      # Email (Mailpit SMTP for dev)
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - MAIL_FROM=noreply@physioguidance.org
      # Storage (local filesystem for dev; set to 'gcp' in production)
      - STORAGE_DRIVER=local
      - STORAGE_LOCAL_DIR=./uploads
    volumes:
      - ./backends/src:/app/src:delegated
      - backend_node_modules:/app/node_modules
      - backend_uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
    networks:
      - physio-network
    restart: unless-stopped

  # ===========================================
  # Database - PostgreSQL
  # ===========================================
  database:
    image: postgres:15-alpine
    container_name: physio-database
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=physioguidance
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - physio-network
    restart: unless-stopped

  # ===========================================
  # Mailpit - Email Testing (Dev SMTP + Web UI)
  # ===========================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: physio-mailpit
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    networks:
      - physio-network
    restart: unless-stopped

  # ===========================================
  # pgAdmin (Optional - Database GUI)
  # ===========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: physio-pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@physioguidance.org
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - database
    networks:
      - physio-network
    profiles:
      - tools

networks:
  physio-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  frontend_node_modules:
  backend_node_modules:
  backend_uploads:
